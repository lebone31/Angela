<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Birthday Cake</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #2d89ef;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
    text-align: center;
}

/* Cake */
.cake {
    width: 220px;
    height: 140px;
    background: #fff;
    border-radius: 20px;
    position: relative;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding-top: 20px;
}

/* Candles */
.candle {
    width: 15px;
    height: 60px;
    background: #fff5cc;
    border-radius: 5px;
    position: relative;
}

/* Flame */
.flame {
    width: 12px;
    height: 25px;
    background: orange;
    border-radius: 50%;
    position: absolute;
    top: -25px;
    left: 1.5px;
    box-shadow: 0 0 10px orange;
    animation: flicker 0.2s infinite;
}

@keyframes flicker {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

/* Wish box */
#wish {
    display: none;
    margin-top: 20px;
    background: white;
    color: black;
    padding: 15px;
    border-radius: 10px;
}

/* Confetti */
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: red;
    top: -10px;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Make a Wish 🎂</h1>

<div class="cake" id="cake">
    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>
</div>

<div id="wish">
    🎉 Happy Birthday! 🎉<br>
    Your wish is now in the universe ✨
</div>

<button onclick="startRecording()">🎤 Record Your Wish</button>

<audio id="song">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

let flameOn = true;
let silence = 0;
let recorder;
let chunks = [];

// 🎤 VOICE RECORDING
function startRecording() {
    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
        recorder = new MediaRecorder(stream);
        recorder.start();

        recorder.ondataavailable = e => chunks.push(e.data);

        setTimeout(() => {
            recorder.stop();
        }, 5000);

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
            chunks = [];
        };
    });
}

// 🎆 CONFETTI
function confettiBurst() {
    for (let i = 0; i < 40; i++) {
        let c = document.createElement("div");
        c.classList.add("confetti");
        c.style.left = Math.random() * window.innerWidth + "px";
        c.style.background = `hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 2000);
    }
}

// 🎵 SONG
function playSong() {
    document.getElementById("song").play();
}

// 🌬️ MIC DETECTION
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const mic = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    mic.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop() {
        analyser.getByteFrequencyData(data);
        let volume = data.reduce((a,b)=>a+b)/data.length;

        // 🔥 BLOW
        if (volume > 25 && flameOn) {
            flameOn = false;

            document.querySelectorAll(".flame").forEach(f => f.style.display = "none");

            document.getElementById("wish").style.display = "block";

            playSong();
            confettiBurst();

            if (navigator.vibrate) {
                navigator.vibrate(500);
            }
        }

        // 🌬️ RELIGHT
        if (!flameOn) {
            silence++;

            if (silence > 80) {
                flameOn = true;
                silence = 0;

                document.querySelectorAll(".flame").forEach(f => f.style.display = "block");
                document.getElementById("wish").style.display = "none";
            }
        }

        requestAnimationFrame(loop);
    }

    loop();
})
.catch(() => alert("Allow microphone access for full experience"));

</script>

</body>
</html>
